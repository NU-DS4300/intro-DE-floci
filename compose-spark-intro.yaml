# Spark ETL intro: OneShop's source systems on top of docker-compose.yaml.
#   - Amazon RDS for PostgreSQL instance `oneshop-db` (users, items, purchases)
#   - S3 bucket `oneshop-pageviews` (website page-view events, JSON Lines)
# plus the PySpark jobs that load them into bronze/silver Iceberg tables.
#
# Always pass both files:
#   docker compose -f docker-compose.yaml -f compose-spark-intro.yaml up -d --build
#
# The floci service is not touched here, so a running emulator keeps going
# (and keeps its data); only spark-iceberg is rebuilt and recreated.
services:
  spark-iceberg:
    volumes:
      # PySpark ETL jobs: `spark-submit /home/iceberg/jobs/<job>.py`.
      - ./jobs:/home/iceberg/jobs

  # Creates the RDS instance and the page-view bucket, fills both with mock
  # data, then exits. Safe to rerun: existing instance, data, and objects are
  # left alone.
  loadgen:
    build: loadgen/
    container_name: loadgen
    init: true
    networks:
      lakehouse_net:
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=000000000000
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://floci:4566
