spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# The `glue` catalog. Points at AWS Glue's Iceberg REST endpoint, which Floci
# serves at /iceberg. Against real AWS, set `uri` to
# https://glue.us-east-1.amazonaws.com/iceberg and drop the two s3.* lines below.
spark.sql.catalog.glue                          org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.glue.type                     rest
spark.sql.catalog.glue.uri                      http://floci:4566/iceberg
# On the Glue REST endpoint the warehouse is the AWS account id, not an s3:// path.
spark.sql.catalog.glue.warehouse                000000000000
spark.sql.catalog.glue.rest.auth.type           sigv4
spark.sql.catalog.glue.rest.signing-name        glue
spark.sql.catalog.glue.rest.signing-region      us-east-1

# Data plane: Iceberg reads and writes the Parquet files through emulated S3.
spark.sql.catalog.glue.io-impl                  org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.glue.s3.endpoint              http://floci:4566
spark.sql.catalog.glue.s3.path-style-access     true

spark.sql.defaultCatalog                        glue

spark.sql.catalogImplementation                 in-memory
